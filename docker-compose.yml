version: '3.8'

services:
  auto_diagrams:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8510:8510"
    volumes:
      - .:/app
    container_name: auto_diagrams
    environment:
      - GIT_PYTHON_REFRESH=quiet
    command: streamlit run show_mermaid.py --server.port=8510 --server.address=0.0.0.0 --server.runOnSave=true
